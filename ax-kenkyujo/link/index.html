  :root{

  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  body{background:var(--paper);min-height:100vh;display:flex;justify-content:center;

  .wrap{width:100%;max-width:480px;min-height:100vh;padding:56px 26px 48px;
    display:flex;flex-direction:column;align-items:center;

  .logo{width:158px;height:158px;border-radius:26px;display:block;

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
  .lead{margin-top:12px;font-family:var(--serif);font-weight:600;font-size:16px;letter-spacing:.06em;color:var(--ink);}
  .tag{margin-top:7px;font-size:11px;font-weight:700;letter-spacing:.22em;color:var(--ink-3);}
  .bio{margin-top:14px;font-size:13.5px;line-height:1.75;text-align:center;max-width:330px;color:#4a463e;}
  /* links */
  .links{width:100%;margin-top:34px;display:flex;flex-direction:column;gap:13px;}
  .lk{display:flex;align-items:center;gap:15px;background:var(--card);border:1px solid var(--line);
    border-radius:15px;padding:15px 18px;text-decoration:none;color:inherit;
    box-shadow:0 4px 14px rgba(20,19,15,.06);transition:transform .15s,box-shadow .15s,border-color .15s;}
  .lk:hover{transform:translateY(-2px);box-shadow:0 9px 20px rgba(20,19,15,.12);border-color:var(--line-2,#D6CFC2);}
  .ic{width:42px;height:42px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;}
  .ax-emblem{font-family:var(--sans);font-weight:800;font-size:17px;color:#fff;letter-spacing:.02em;}
  .tx{display:flex;flex-direction:column;min-width:0;}
  .tx b{font-size:15.5px;font-weight:700;letter-spacing:.02em;}
  .tx span{font-size:11.5px;margin-top:2px;color:var(--ink-3);letter-spacing:.02em;}
  .arw{margin-left:auto;color:#bdb6a8;font-size:19px;}
  .pend{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--ink-3);
    border:1px solid var(--line);border-radius:999px;padding:3px 9px;letter-spacing:.06em;}
  .lk.primary{background:var(--accent);border-color:var(--accent);}
  .lk.primary .tx b{color:#fff;} .lk.primary .tx span{color:#f3d8d0;}
  .lk.primary .arw{color:#fff;} .lk.primary .ic{background:rgba(255,255,255,.16)!important;}
  .lk.pending{opacity:.66;} .lk.pending:hover{transform:none;}
  .foot{margin-top:36px;font-size:11px;letter-spacing:.1em;text-align:center;line-height:1.9;color:var(--ink-3);}
  .foot a{color:var(--accent);text-decoration:none;}
</style>
