# XcodeGen 用のプロジェクト定義
#   brew install xcodegen
#   cd focus-lock-ios && xcodegen generate
# で FocusLock.xcodeproj が生成されます。
#
# ★ 自分用に変更するのは下の settings.base の3行だけです。
name: FocusLock

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    # ↓ Apple Developer の Team ID（Xcode の Signing でも後から選べます）
    DEVELOPMENT_TEAM: ""
    # ↓ 世界で一意になる ID にする（例: com.hodaka.focuslock）
    BASE_BUNDLE_ID: com.yourname.focuslock
    # ↓ "group." + 上の ID にしておけばOK
    APP_GROUP_ID: group.com.yourname.focuslock
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  # 本体アプリ
  FocusLock:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - ReportShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FocusLock
        AppGroupID: $(APP_GROUP_ID)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: App/FocusLock.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    dependencies:
      - target: FocusLockMonitor
      - target: FocusLockShieldConfig
      - target: FocusLockShieldAction
      - target: FocusLockReport

  # 時間になったらロック／解除するバックグラウンド処理
  FocusLockMonitor:
    type: app-extension
    platform: iOS
    sources:
      - MonitorExtension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).monitor
    info:
      path: MonitorExtension/Info.plist
      properties:
        CFBundleDisplayName: FocusLockMonitor
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    entitlements:
      path: MonitorExtension/FocusLockMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(APP_GROUP_ID)]

  # ロック画面（シールド）の見た目
  FocusLockShieldConfig:
    type: app-extension
    platform: iOS
    sources:
      - ShieldConfigurationExtension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).shieldconfig
    info:
      path: ShieldConfigurationExtension/Info.plist
      properties:
        CFBundleDisplayName: FocusLockShieldConfig
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: ShieldConfigurationExtension/FocusLockShieldConfig.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(APP_GROUP_ID)]

  # ロック画面のボタンを押したときの処理
  FocusLockShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - ShieldActionExtension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).shieldaction
    info:
      path: ShieldActionExtension/Info.plist
      properties:
        CFBundleDisplayName: FocusLockShieldAction
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: ShieldActionExtension/FocusLockShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(APP_GROUP_ID)]

  # スクリーンタイム（利用時間・持ち上げ回数）の表示
  FocusLockReport:
    type: extensionkit-extension
    platform: iOS
    sources:
      - ReportExtension
      - ReportShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).report
    info:
      path: ReportExtension/Info.plist
      properties:
        CFBundleDisplayName: FocusLockReport
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
    entitlements:
      path: ReportExtension/FocusLockReport.entitlements
      properties:
        com.apple.developer.family-controls: true
