name: Drive sync

# Google Drive の operations/ 配下（CLAUDE.md・workflows・knowledge）を
# リポジトリの drive/ へ片方向ミラーする。Mac mini の起動は不要。
# セットアップ手順: docs/drive-sync-setup.md

on:
  schedule:
    # JST 06:00 = UTC 21:00（前日）
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '差分の確認のみ行い、コミットしない'
        type: boolean
        default: false

# 同時実行すると push が競合するため直列化する。
concurrency:
  group: drive-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          rclone version | head -1

      - name: Write service account key
        env:
          # シェルに展開させず環境変数経由で渡す。鍵の中身がコマンドライン
          # やプロセス一覧に現れないようにするため。
          SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: |
          if [ -z "$SA_KEY" ]; then
            echo "::error::secret GDRIVE_SA_KEY が未設定です" >&2
            exit 1
          fi
          umask 077
          printf '%s' "$SA_KEY" > "$RUNNER_TEMP/sa.json"
          # 鍵の中身は出さず、JSON として妥当かだけ確認する。
          python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$RUNNER_TEMP/sa.json"

      - name: Sync from Drive
        env:
          SA_KEY_FILE: ${{ runner.temp }}/sa.json
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_TEAM_DRIVE_ID: ${{ vars.GDRIVE_TEAM_DRIVE_ID }}
          DEST_DIR: drive
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: ./scripts/drive-sync.sh

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"

      - name: Commit changes
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  'drive-sync[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A drive
          if git diff --staged --quiet; then
            echo '変更なし'
            exit 0
          fi
          git diff --staged --stat
          git commit -m "chore(drive-sync): Google Drive の変更を取り込み"
          git push
